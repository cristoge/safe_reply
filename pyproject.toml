[project]
name = "revision-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cristoge", email = "cristo.g@outlook.es" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
revision-rag = "revision_rag:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Los tests y fixtures async no necesitan @pytest.mark.asyncio.
asyncio_mode = "auto"
# Un solo event loop para toda la sesión de tests: el engine (y su pool de
# conexiones) se crea una vez y las conexiones van ligadas a ese loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
