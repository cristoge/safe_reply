# Herramientas y tareas del proyecto. Primera vez: `mise trust` y `mise install`.
# Ver las tareas: `mise tasks`.

[tools]
# La misma versión que .python-version (la que usa uv).
python = "3.14"
# Exacta: el build backend del pyproject pide uv_build >=0.12.23,<0.13.0.
uv = "0.12.23"

[tasks."docker:up"]
description = "Levanta Postgres y Redis y espera a que estén healthy"
run = "docker compose up -d --wait"

[tasks."docker:down"]
description = "Para y borra los contenedores (los datos siguen en los volúmenes)"
run = "docker compose down"

[tasks.fastapi]
description = "Arranca la API con recarga automática (levanta Docker antes)"
# Sin Postgres y Redis la app no arranca (fail fast en el lifespan).
depends = ["docker:up"]
run = "uv run uvicorn safe_reply.main:app --reload"

[tasks."agent:create"]
description = "Crea un agente de soporte (pide la contraseña). Uso: mise run agent:create -- email --name Nombre"
# Los agentes no se registran por la API: si /auth/register pudiera crearlos,
# cualquiera se daría permisos.
run = "uv run python scripts/create_agent.py"

[tasks."ml:data"]
description = "Descarga Banking77 (PolyAI) en ml/data/banking77/ y comprueba los checksums"
# Los datos no están en Git (ml/data/ está ignorado). ml/banking77.sha256 fija
# la versión exacta: si PolyAI cambiara los archivos, la tarea falla en vez de
# entrenar con otros datos sin avisar.
run = """
mkdir -p ml/data/banking77
for f in train.csv test.csv categories.json; do
  curl -fsSL -o "ml/data/banking77/$f" "https://raw.githubusercontent.com/PolyAI-LDN/task-specific-datasets/master/banking_data/$f"
done
cd ml/data/banking77 && shasum -a 256 -c ../../banking77.sha256
"""

[tasks."ml:train"]
description = "Entrena el clasificador y lo guarda en models/ (lo carga el backend al arrancar)"
run = "uv run python ml/train.py"

[tasks."ml:evaluate"]
description = "Evalúa la v1 tal como arranca (YAML + models/ + predefinidas) y guarda ml/results/evaluation.json"
run = "uv run python ml/evaluate.py"

[tasks.alerts]
description = "Consultas de alerta: cola, atascos, % a persona y escalados (sale con 1 si salta alguna)"
run = "uv run python scripts/alerts.py"
