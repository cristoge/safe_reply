# Reglas de negocio del sistema de tickets (apartado 5 del diseño).
#
# Fuera del código y de la BD: cambiar una regla = cambiar este fichero (queda en
# Git con su motivo). Los tickets guardan el RESULTADO de aplicarlas en su momento.
#
# Por intención:
#   ticket_type     capítulo del manual en el que busca el RAG
#   priority        low | medium | high (prioridad base; la urgencia puede subirla)
#   route           ai | human ("human" = siempre persona, sin LLM)
#   answer_mode     rag | canned (solo con route: ai) · canned = respuesta predefinida
#   min_confidence  opcional: umbral propio, más exigente que el general
#   reason          obligatorio con route: human → acaba en route_reason

# Elegido con ml/compare_models.py y ml/robustness.py (2026-10-17, test de Banking77):
# 0 tickets de persona se cuelan · la IA responde el 45 % (20 % con predefinidas) ·
# 0 de 40 mensajes fuera de ámbito van a la IA. Con min_confidence 0.7 la IA respondería
# el 51 %, pero también el 12.5 % de las preguntas de banca que no conoce (0.8: 9.7 %).
router:
  min_confidence: 0.8 # por debajo → persona ("low confidence")
  max_p_human: 0.1 # P(persona) ≥ esto → persona ("ambiguous with sensitive intent")
  canned_min_confidence: 0.9 # las predefinidas exigen más: el juez no las protege

# Red de seguridad (regla 0 del router): si el texto encaja con alguna, va a persona
# aunque el modelo prediga una intención de IA. Para tickets con dos problemas
# ("my card might be compromised, can I get a virtual card?") en los que el modelo
# está seguro de la intención inocente. Expresiones regulares, sin distinguir mayúsculas.
# Medido en el test de Banking77: solo 2 llamadas de más en 3080 tickets.
sensitive_patterns:
  - '\bstolen\b'
  - '\bcompromised\b'
  - '\bfraud'
  - '\bhack(?:ed|er|ers)?\b'
  - '\bscam'
  - "\\b(?:not|wasn'?t|was not) me\\b"
  - '\bnot mine\b'
  - "\\b(?:didn'?t|did not|never) (?:make|made|authori[sz]e|do)\\b"
  - '\bunauthori[sz]ed\b'
  - "\\b(?:don'?t|do not|didn'?t|did not) recogni[sz]e\\b"
  - '\bsomeone (?:else )?(?:used|took|made|withdrew|has used|is using|stole)\b'
  - "\\b(?:transfer|money|payment)\\b.{0,40}\\b(?:never arrived|hasn'?t arrived|has not arrived|not arrived|didn'?t arrive|not received|never received|hasn'?t received)\\b"

# Plazo para atender un ticket que va a persona (tickets.due_at), en horas
due_hours:
  high: 1
  medium: 4
  low: 24

# Detector de urgencia: sube un nivel la prioridad base de la intención (como
# mucho, a high). Basta una señal; varias no suben más de un nivel.
urgency:
  patterns:
    - '\burgent(?:ly)?\b'
    - '\basap\b'
    - '\bas soon as possible\b'
    - '\bimmediately\b'
    - '\bemergency\b'
    - '!{3,}'
  # El cliente insiste: su ticket número N (contando este) en la ventana.
  repeat_tickets: 3
  repeat_window_hours: 24

# Cola humana (S5).
human_queue:
  # Reclamado y sin llegar a contacted en este tiempo → otro agente puede
  # reclamarlo. Se comprueba en la propia consulta de reclamar, sin barrido.
  claim_timeout_hours: 2
  # Llamadas fallidas seguidas → mensaje al cliente ("we tried to call you…") y
  # el ticket vuelve a la cola sin asignar.
  max_failed_calls: 3

# El RAG llega en la v2. Mientras esté apagado, las intenciones con answer_mode
# rag que el router manda al RAG responden con su predefinida (genérica a
# propósito: "si no es tu caso, responde y te llamamos").
rag_enabled: false

